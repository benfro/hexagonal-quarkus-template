quarkus.application.name=order-service

# --- PostgreSQL ---
quarkus.datasource.db-kind=postgresql
# dev + test: no URL configured, so Dev Services starts PostgreSQL in a container (Docker/Podman required).
# prod: supply connection details through the environment.
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# --- Schema: owned by Flyway (migrations live in adapter-out-persistence) ---
quarkus.flyway.migrate-at-start=true

%dev.quarkus.hibernate-orm.log.sql=true
